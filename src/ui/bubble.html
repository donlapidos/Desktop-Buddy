<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  @font-face { font-family: "Schibsted Grotesk"; src: url("fonts/schibsted-grotesk-var.woff2") format("woff2"); font-weight: 400 900; }
  /* The bubble is the island opened up, so it wears the island's near-black in light and dark mode alike. */
  :root {
    --bg: #0c0d10; --fg: #eef0f3; --muted: #8b919c; --line: rgba(255,255,255,.07);
    --buddy: #2f7aff; --buddy-ink: #fff; --field: #1a1c21; --field-hover: #23262d; --danger: #ff8a5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; font: 14px/1.45 "Schibsted Grotesk", "Segoe UI", sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  .card { position: absolute; inset: 46px 6px 6px; display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 12px 14px; border-radius: 18px; background: var(--bg); box-shadow: 0 14px 34px rgba(0,0,0,.34), inset 0 0 0 1px var(--line); overflow: hidden; }
  /* The card slides out from under the island pill and unfolds, on the same curve the island uses when it
     widens on hover, and folds back under it the same way. Folded, it is a pill parked exactly behind the
     island's (the window starts at the island's top; the island window sits above this one). */
  .card {
    --ease: cubic-bezier(.2, .8, .2, 1);
    transform: translateY(-40px);
    clip-path: inset(0 25% calc(100% - 34px) 25% round 17px);
    opacity: 0;
    transition: clip-path .3s var(--ease), transform .3s var(--ease), opacity .1s linear .2s;
  }
  body.open .card {
    transform: none;
    clip-path: inset(-40px round 18px);
    opacity: 1;
    transition: clip-path .32s var(--ease), transform .32s var(--ease), opacity .06s linear;
  }
  /* Contents arrive once there's room for them and leave before the fold gets tight. */
  .card > * { opacity: 0; transition: opacity .1s linear; }
  body.open .card > * { opacity: 1; transition: opacity .18s linear .12s; }
  @media (prefers-reduced-motion: reduce) { .card, body.open .card, .card > * { transition: none !important; } }
  header { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--buddy); flex: none; }
  header .dot.busy { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  header .where { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  header button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; padding: 2px 4px; border-radius: 6px; }
  header button:hover { color: var(--fg); background: var(--field); }
  header button.icon { display: grid; place-items: center; width: 24px; height: 22px; padding: 0; }
  header button.icon svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  #reply { flex: 1; overflow-y: auto; white-space: pre-wrap; }
  #reply:empty::before { content: "Ask me how to do something here, or ask me to do it for you."; color: var(--muted); }
  #reply.status { color: var(--muted); }
  #reply::-webkit-scrollbar { width: 8px; }
  #reply::-webkit-scrollbar-thumb { background: #2a2d34; border-radius: 4px; }
  #marks.on + #reply:empty::before { content: none; }
  form { display: flex; gap: 6px; }
  input { flex: 1; min-width: 0; border: 1px solid transparent; border-radius: 10px; padding: 9px 11px; background: var(--field); color: var(--fg); font: inherit; outline: none; }
  input:focus { border-color: color-mix(in srgb, var(--buddy) 70%, transparent); }
  input::placeholder { color: #6f7682; }
  .btn { border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-weight: 600; cursor: pointer; background: var(--buddy); color: var(--buddy-ink); }
  .btn:hover { background: color-mix(in srgb, var(--buddy) 82%, white); }
  .btn.ghost { background: var(--field); color: var(--fg); font-weight: 500; }
  .btn.ghost:hover, .btn.deny:hover { background: var(--field-hover); }
  .btn.deny { background: var(--field); color: var(--danger); font-weight: 500; }
  #confirm { display: none; flex-direction: column; gap: 8px; padding: 10px; border-radius: 12px; background: var(--field); }
  #confirm.on { display: flex; }
  #confirm .what { font-weight: 600; overflow-wrap: anywhere; }
  #confirm .why { font-size: 12.5px; color: var(--muted); }
  #confirm .why:empty { display: none; }
  #confirm .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #marks { display: none; flex-wrap: wrap; gap: 6px; align-items: center; }
  #marks.on { display: flex; }
  .chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 9px 3px 3px; border-radius: 999px; background: color-mix(in srgb, var(--buddy) 16%, transparent); color: color-mix(in srgb, var(--buddy) 18%, white); font-size: 12.5px; }
  .chip b { display: grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: color-mix(in srgb, var(--buddy) 78%, black); color: #fff; font-size: 11px; flex: none; }
  .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #marks .btn { padding: 4px 10px; font-size: 12.5px; }
  kbd { font: 500 11px "Schibsted Grotesk", sans-serif; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line); }
  /* Mic: say the question instead of typing it. While listening the button rings with the voice. */
  #mic { width: 38px; padding: 0; display: grid; place-items: center; flex: none; }
  #mic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
  body.listening #mic { background: var(--buddy); color: #fff; animation: ring 1.3s ease-out infinite; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--buddy) 55%, transparent); } 100% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--buddy) 0%, transparent); } }
  @media (prefers-reduced-motion: reduce) { body.listening #mic { animation: none; } }
  /* First-run setup: three ways in, each opening to its own short page. */
  #welcome { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
  #welcome[hidden], #form[hidden], #reply[hidden] { display: none; }
  #welcome p { margin: 0; }
  /* Nothing on a welcome page is squeezed to fit: past the bubble's height, the page scrolls instead. */
  #welcome > * { flex: none; }
  #welcome .lede { color: var(--muted); font-size: 13px; }
  /* Before an AI is set up, there's no conversation to move or restart, and nothing to say out loud. */
  body.welcoming #totask, body.welcoming #new, body.welcoming #mic { display: none; }
  .door { display: flex; flex-direction: column; align-items: flex-start; gap: 0; width: 100%; flex: none; text-align: left; border: 0; border-radius: 11px; padding: 6px 11px; background: var(--field); color: var(--fg); font: inherit; line-height: 1.35; cursor: pointer; }
  .door:hover { background: var(--field-hover); }
  .door b { font-weight: 600; }
  .door span { font-size: 12.5px; color: var(--muted); }
  .door.ready b::after { content: "  ✓"; color: var(--buddy); }
  #welcome .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  #welcome .app { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 4px 4px 11px; border-radius: 10px; background: var(--field); }
  #welcome .app .added { color: var(--muted); font-size: 12.5px; padding: 6px 8px; }
  #welcome .btn { padding: 6px 11px; font-size: 13px; }
  #welcome .problem { color: var(--danger); font-size: 13px; }
  #welcome .link { align-self: flex-start; border: 0; padding: 0; background: none; color: color-mix(in srgb, var(--buddy) 55%, white); font: inherit; font-size: 12.5px; text-align: left; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  #welcome .problem:empty { display: none; }
  /* What the last answer cost, under it. */
  #spend { margin-top: -6px; font-size: 11.5px; color: var(--muted); text-align: right; }
  #spend:empty, body.welcoming #spend { display: none; }
  /* The tour's tip: a quiet strip above the field, in Buddy's colour. */
  #tip { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 10px; border-radius: 10px; background: color-mix(in srgb, var(--buddy) 14%, var(--field)); font-size: 12.5px; line-height: 1.35; }
  #tip[hidden] { display: none; }
  #tip span { flex: 1; }
  #tip button { flex: none; border: 0; border-radius: 8px; padding: 5px 9px; background: color-mix(in srgb, var(--buddy) 28%, var(--field)); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
  #tip button:hover { background: color-mix(in srgb, var(--buddy) 40%, var(--field)); }
  #welcome::-webkit-scrollbar { width: 8px; }
  #welcome::-webkit-scrollbar-thumb { background: #2a2d34; border-radius: 4px; }
</style>
</head>
<body>
<div class="card">
  <header>
    <span class="dot" id="dot"></span>
    <span class="where" id="where">Buddy</span>
    <button id="totask" title="Move this conversation into its own task window. It keeps working there, and the bubble is free again.">Make task</button>
    <button id="new" title="Start a new conversation">New</button>
    <button id="settings" class="icon" title="Settings" aria-label="Settings"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h7M12.5 5H14M2 11h2M7.5 11H14"/><circle cx="10.75" cy="5" r="1.75"/><circle cx="5.75" cy="11" r="1.75"/></svg></button>
    <button id="stop" title="Stop (Esc)" hidden>Stop</button>
  </header>
  <div id="marks"></div>
  <div id="welcome" hidden></div>
  <div id="reply"></div>
  <div id="spend"></div>
  <div id="confirm">
    <div>Can I do this? <span class="what" id="what"></span></div>
    <div class="why" id="why"></div>
    <div class="row">
      <button class="btn" data-d="allow">Allow</button>
      <button class="btn ghost" data-d="always">Allow for this task</button>
      <button class="btn deny" data-d="deny">Don't</button>
    </div>
  </div>
  <div id="tip" hidden><span id="tip-text"></span><button id="tip-do" type="button"></button></div>
  <form id="form">
    <input id="input" autocomplete="off" spellcheck="false" placeholder="How do I…?  or  Do it for me">
    <button class="btn ghost" id="mic" type="button" title="Say it (Ctrl+Alt+T). Pause when you're done."><svg viewBox="0 0 16 16"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/></svg></button>
    <button class="btn" id="submit" type="submit">Ask</button>
  </form>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  let needsKey = false, busy = false;

  function setBusy(on) {
    busy = on;
    $("dot").classList.toggle("busy", on);
    $("stop").hidden = !on;
    $("input").disabled = on;
  }

  function show(text, status = false) {
    $("reply").textContent = text;
    $("reply").classList.toggle("status", status);
  }

  // The tour's tip, or none (null).
  let tip = null;
  function showTip(t) {
    tip = t;
    $("tip").hidden = !t || needsKey;
    if (!t) return;
    $("tip-text").textContent = t.text;
    $("tip-do").textContent = t.action;
  }
  $("tip-do").addEventListener("click", () => tip && window.buddy.tour(tip.event));
  window.buddy.onTour((t) => showTip(t));

  window.buddy.onSummon(({ target, needsKey: nk, tip: t }) => {
    needsKey = nk;
    showTip(t);
    $("marks").classList.remove("on");
    $("where").textContent = nk ? "Welcome to Buddy" : target ? `Looking at ${target}` : "Buddy";
    if (nk) welcome("doors");
    else leaveWelcome();
    if (!busy) { $("input").disabled = false; $("input").value = ""; if (!nk) $("input").focus(); }
  });

  // ---------- First-run setup: three ways in, never a bare "paste a key" ----------
  const el = (tag, props = {}, ...kids) => {
    const n = Object.assign(document.createElement(tag), props);
    n.append(...kids);
    return n;
  };
  const button = (cls, text, onClick) => { const b = el("button", { className: cls, type: "button", textContent: text }); b.addEventListener("click", onClick); return b; };
  const back = () => button("btn ghost", "Back", () => welcome("doors"));
  let welcomeData = null;

  function leaveWelcome() {
    document.body.classList.remove("welcoming");
    $("submit").textContent = "Ask";
    $("welcome").hidden = true;
    $("reply").hidden = false;
    $("form").hidden = false;
    $("input").type = "text";
    $("input").placeholder = "How do I…?  or  Do it for me";
    showTip(tip); // a tour tip that came while setting up
  }

  // page: "doors" (the three choices), "apps", "local" or "key".
  async function welcome(page) {
    const box = $("welcome");
    document.body.classList.add("welcoming");
    $("submit").textContent = "Save";
    box.hidden = false;
    $("reply").hidden = true;
    $("form").hidden = page !== "key";
    console.log("WELCOME_PAGE " + page);
    if (page === "key") {
      $("input").type = "password";
      $("input").placeholder = "Paste an API key";
      box.replaceChildren(
        el("p", { textContent: "Paste a key from Anthropic, OpenAI, Google Gemini or OpenRouter. It's kept encrypted on this PC." }),
        el("p", { className: "problem" }),
        el("div", { className: "row" }, back(), button("btn ghost", "DeepSeek or another server…", () => window.buddy.openSettings("claude"))),
        button("link", "No key? Would you want Buddy Plus, with the AI included?", () => window.buddy.plusInterest()),
      );
      $("input").focus();
      return;
    }
    if (page === "doors" || !welcomeData) {
      box.replaceChildren(el("p", { className: "lede", textContent: "Looking for what's on this PC…" }));
      welcomeData = await window.buddy.welcomeState();
    }
    const { apps, local } = welcomeData;
    if (page === "doors") {
      const found = apps.map((a) => a.label);
      const inApp = apps.some((a) => a.added);
      const door = (title, sub, go, ready = false) => { const b = el("button", { className: `door${ready ? " ready" : ""}`, type: "button" }, el("b", { textContent: title }), el("span", { textContent: sub })); b.addEventListener("click", go); b.dataset.door = go.name; return b; };
      box.replaceChildren(
        el("p", { className: "lede", textContent: "Buddy needs an AI to think with. Pick one way in:" }),
        door("Use the AI app I already have", found.length ? `${found.slice(0, 3).join(", ")}${found.length > 3 ? "…" : ""} on this PC. No key needed.` : "Claude, Codex, Gemini CLI, Cursor and others. No key needed.", function apps() { welcome("apps"); }, inApp),
        door("Free, on this PC", local.use ? `${local.use.label} is running. Private: nothing leaves this PC.` : "With Ollama or LM Studio. Private: nothing leaves this PC.", function local() { welcome("local"); }),
        door("I have an API key", "Anthropic, OpenAI, Google Gemini, OpenRouter…", function key() { welcome("key"); }),
      );
      return;
    }
    if (page === "apps") {
      const problem = el("p", { className: "problem" });
      const rows = apps.map((a) => {
        const row = el("div", { className: "app" }, el("span", { textContent: a.label }));
        if (a.added) row.append(el("span", { className: "added", textContent: "Buddy is in it" }));
        else row.append(button("btn", "Add Buddy", async (e) => {
          e.target.disabled = true;
          e.target.textContent = "Adding…";
          const res = await window.buddy.welcomeApp(a.id);
          console.log("WELCOME_APP " + JSON.stringify({ id: a.id, error: res.error }));
          if (res.error) { problem.textContent = res.error; e.target.disabled = false; e.target.textContent = "Add Buddy"; return; }
          welcomeData = res.state;
          box.replaceChildren(
            el("p", { textContent: `Buddy is in ${a.label}. ${res.after}` }),
            el("p", { className: "lede", textContent: `Then ask there, for example: "Use Buddy to show me how to make a chart here." Buddy looks at your screen and points the way. The bubble here can also think on its own, with one of the other two ways.` }),
            el("div", { className: "row" }, back()),
          );
        }));
        return row;
      });
      box.replaceChildren(
        el("p", { textContent: apps.length ? "You'll ask in your AI app, and Buddy looks and points for it. It runs on that app's own plan." : "No AI app Buddy works with was found on this PC. Buddy works with Claude (the app or Claude Code), Codex, Gemini CLI, Cursor, VS Code, Windsurf and LM Studio. Install one, or pick another way." }),
        ...rows,
        problem,
        el("div", { className: "row" }, back()),
      );
      return;
    }
    if (page === "local") {
      const problem = el("p", { className: "problem" });
      const go = local.use
        ? button("btn", `Use ${local.use.label}`, async (e) => {
            e.target.disabled = true;
            e.target.textContent = "Setting up…";
            const res = await window.buddy.welcomeLocal();
            console.log("WELCOME_LOCAL " + JSON.stringify(res));
            if (!res.ok) { problem.textContent = res.error ?? "That didn't work."; e.target.disabled = false; e.target.textContent = `Use ${local.use.label}`; return; }
            needsKey = false;
            leaveWelcome();
            $("where").textContent = "Buddy";
            show(`Ready. I'm thinking with ${res.label} on this PC. Ask me anything about what's on your screen.`);
            $("input").focus();
          })
        : button("btn", "Check again", async (e) => {
            e.target.disabled = true;
            e.target.textContent = "Checking…";
            welcomeData = await window.buddy.welcomeState();
            welcome("local");
          });
      box.replaceChildren(el("p", { textContent: local.text }), problem, el("div", { className: "row" }, back(), go));
    }
  }

  // Wait a frame so the window has painted the folded pill before it unfolds.
  window.buddy.onBubbleOpen(() => requestAnimationFrame(() => requestAnimationFrame(() => {
    document.body.classList.add("open");
    if (!$("input").disabled) $("input").focus();
  })));
  window.buddy.onBubbleClose(() => document.body.classList.remove("open"));

  window.buddy.onStatus((text) => show(text, true));

  // What the user highlighted: numbered chips matching the marker numbers on screen.
  window.buddy.onMarks((list) => {
    const box = $("marks");
    box.replaceChildren();
    for (const m of list) {
      const chip = document.createElement("span");
      chip.className = "chip";
      const n = document.createElement("b");
      n.textContent = m.n;
      const label = document.createElement("span");
      label.textContent = m.label;
      chip.append(n, label);
      box.append(chip);
    }
    const explain = document.createElement("button");
    explain.className = "btn ghost";
    explain.type = "button";
    explain.textContent = list.length > 1 ? "Explain these" : "Explain this";
    explain.addEventListener("click", () => { $("input").value = "Explain what I highlighted."; $("form").requestSubmit(); });
    box.append(explain);
    box.classList.add("on");
    $("where").textContent = `${list.length} marked`;
    $("input").placeholder = list.length > 1 ? "Ask about these marks… (e.g. compare 1 and 2)" : "Ask about what you marked…";
    show("");
  });
  window.buddy.onReply((text) => { show(text); $("where").textContent = "Buddy"; });

  // An approval takes a deliberate click: nothing on the card takes focus (a key meant for another app or the field
  // must never land on Allow), and clicks in its first moments are ignored (a click already on its way doesn't count).
  const ARM_MS = 500;
  let confirmAt = 0;
  window.buddy.onConfirm(({ summary, note }) => {
    $("what").textContent = summary;
    $("why").textContent = note && note.toLowerCase() !== summary.toLowerCase() ? note : "";
    $("confirm").classList.add("on");
    confirmAt = performance.now();
  });

  // Nothing waits any more (answered elsewhere, or the asker stopped): the card comes down.
  window.buddy.onConfirmClear(() => $("confirm").classList.remove("on"));

  $("confirm").addEventListener("pointerdown", (e) => console.log("TRACE press on approval: " + (e.target.dataset?.d || e.target.tagName) + " open=" + document.body.classList.contains("open")));
  $("confirm").addEventListener("click", (e) => {
    const d = e.target.dataset?.d;
    if (!d || performance.now() - confirmAt < ARM_MS) return;
    $("confirm").classList.remove("on");
    window.buddy.confirmReply(d);
  });

  // Voice: the main process listens and transcribes; the words land in the field and go like a typed question.
  let listening = false, spoken = false;
  window.buddy.onListening((on) => {
    listening = on;
    document.body.classList.toggle("listening", on);
    if (on) show("Listening… pause when you're done.", true);
    else if ($("reply").textContent.startsWith("Listening")) show("");
  });
  window.buddy.onVoiceText((text) => {
    if (busy || needsKey) return;
    $("input").value = text;
    spoken = true;
    $("form").requestSubmit();
  });
  $("mic").addEventListener("click", () => window.buddy.talk());

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = $("input").value.trim();
    const wasSpoken = spoken;
    spoken = false;
    if (!text || busy) return;
    $("input").value = "";
    if (needsKey) {
      const { ok, error } = await window.buddy.setKey(text);
      console.log("WELCOME_KEY " + JSON.stringify({ ok, error }));
      if (!ok) {
        $("welcome").querySelector(".problem").textContent = error ?? "That didn't work. Try again.";
        return;
      }
      needsKey = false;
      leaveWelcome();
      $("where").textContent = "Buddy";
      show("Got it. Ask me anything about what's on your screen.");
      return;
    }
    setBusy(true);
    $("spend").textContent = "";
    show(wasSpoken ? `“${text}”` : "Thinking…", true);
    const { reply, spend } = await window.buddy.ask(text, { spoken: wasSpoken });
    setBusy(false);
    show(reply);
    $("spend").textContent = spend ?? "";
    $("confirm").classList.remove("on");
  });

  $("stop").addEventListener("click", () => window.buddy.cancel());
  $("totask").addEventListener("click", () => window.buddy.newTask());
  $("settings").addEventListener("click", () => window.buddy.openSettings());
  $("new").addEventListener("click", () => { window.buddy.reset(); show(""); $("spend").textContent = ""; $("input").focus(); });
  addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (busy || listening) window.buddy.cancel(); else window.buddy.hide();
  });
</script>
</body>
</html>
