name: Release

# Builds Desktop Buddy's Windows installer and uploads it, with latest.yml (the installer's SHA-512, which installed
# copies check every download against), to a DRAFT GitHub release v<version>. Nothing is public until the maintainer
# reviews the draft and publishes it; installed copies only see published releases.
#
# To release: bump "version" in package.json and add it to CHANGELOG.md, commit, then push a matching tag:
#   git tag v0.2.1 && git push origin v0.2.1
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the draft release and upload the installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag matches the app's version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No install scripts: electron-builder fetches its own Electron, and nothing else needs one.
      - name: Install
        run: npm ci --ignore-scripts

      # The installer carries the agent-desktop CLI: the upstream release pinned in package.json, checksum verified.
      - name: Fetch agent-desktop
        run: npm run setup

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # electron-builder uploads its files in parallel and, finding no release, each upload can create its own
      # draft. Creating the draft first gives them one to share. The tag is v<version> because that's what
      # electron-updater reads versions from.
      - name: Create the draft release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" --draft --title "Desktop Buddy $version" --target "$GITHUB_SHA" --notes "Desktop Buddy $version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the installer and upload it to the draft release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
