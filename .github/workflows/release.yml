name: Release

# Builds Desktop Buddy's Windows installer and uploads it, with latest.yml (the installer's SHA-512, which installed
# copies check every download against), to a DRAFT GitHub release v<version>. Nothing is public until the maintainer
# reviews the draft and publishes it; installed copies only see published releases.
#
# To release: bump "version" in package.json and add it to CHANGELOG.md, commit, then push a matching tag:
#   git tag v0.2.1 && git push origin v0.2.1
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the draft release and upload the installer
    env:
      # 'true' only when the signing certificate secret exists (a step's `if` can't read secrets directly).
      HAS_CERT: ${{ secrets.WIN_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag matches the app's version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # No install scripts: electron-builder fetches its own Electron, and nothing else needs one.
      - name: Install
        run: npm ci --ignore-scripts

      # The installer carries the agent-desktop CLI: the upstream release pinned in package.json, checksum verified.
      - name: Fetch agent-desktop
        run: npm run setup

      # Live marking's overlay and the commands' wall launcher, compiled here so Buddy never compiles anything on a
      # user's PC (src/native.js). The installer carries them in resources/native.
      - name: Build the native helpers
        run: npm run native

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      # electron-builder uploads its files in parallel and, finding no release, each upload can create its own
      # draft. Creating the draft first gives them one to share. The tag is v<version> because that's what
      # electron-updater reads versions from.
      - name: Create the draft release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" --draft --title "Desktop Buddy $version" --target "$GITHUB_SHA" --notes "Desktop Buddy $version"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Code signing, only when the certificate is there. With the WIN_CSC_LINK secret (the .pfx, base64 encoded)
      # and WIN_CSC_KEY_PASSWORD set, electron-builder signs Buddy's exe, the uninstaller and the installer while it
      # builds, and only then works out latest.yml and the blockmap, so their SHA-512 and size describe the signed
      # installer that installed copies download. Nothing has to be rebuilt afterwards. Without the secrets the
      # variables are never set and the build is unsigned, as before (an empty CSC_LINK is not passed on, so it
      # can't be mistaken for a certificate).
      - name: Build the installer and upload it to the draft release
        shell: bash
        run: |
          if [ -n "$SIGN_LINK" ]; then
            export CSC_LINK="$SIGN_LINK" CSC_KEY_PASSWORD="$SIGN_PASSWORD"
            echo "Signing with the certificate from WIN_CSC_LINK"
          else
            echo "No WIN_CSC_LINK secret: building unsigned"
          fi
          npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGN_LINK: ${{ secrets.WIN_CSC_LINK }}
          SIGN_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # When a certificate was given, a build that came out unsigned must not look like a good release.
      - name: The installer is signed
        if: ${{ env.HAS_CERT == 'true' }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $sig = Get-AuthenticodeSignature "dist/Desktop-Buddy-Setup-$version.exe"
          "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "The installer is not validly signed ($($sig.Status))" }
