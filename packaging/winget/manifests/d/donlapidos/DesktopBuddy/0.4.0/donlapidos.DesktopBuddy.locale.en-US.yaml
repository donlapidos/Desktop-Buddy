ShortDescription: Shows you where to click, in any Windows app, with the AI you choose.
Description: |-
  Ask Desktop Buddy how to do something in the app in front of you. Its pointer flies to the button you need and
  says what to do, one step at a time, while you do the clicking. It works with the AI app you already use, a key
  from an AI company, or a free model on your own PC. It does things for you only when you ask, and asks before
  each one unless you tell it otherwise.
